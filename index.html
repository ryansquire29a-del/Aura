    <script>
      // Gracefully ignore harmless WebSocket / HMR disconnection errors in sandbox & iframe environments
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var message = (reason && (reason.message || reason.toString())) || '';
        var stack = (reason && reason.stack) || '';
        if (
          message.includes('WebSocket') ||
          message.includes('closed without opened') ||
          stack.includes('@vite/client') ||
          message.includes('vite:ws')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation && event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (event) {
        var message = event && event.message ? event.message : '';
        var filename = event && event.filename ? event.filename : '';
        if (
          message.includes('WebSocket') ||
          filename.includes('@vite/client') ||
          message.includes('closed without opened')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation && event.stopImmediatePropagation();
        }
      });
    </script>
